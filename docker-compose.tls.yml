services:
  backend:
    volumes: !override []

  scheduler:
    volumes: !override []

  nginx:
    ports: !override
      - "80:80"
      - "443:443"

    volumes: !override
      - ./nginx/default.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - --quiet
        - --spider
        - https://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s